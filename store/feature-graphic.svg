<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
<defs><radialGradient id="g" cx="25%" cy="50%" r="70%"><stop offset="0" stop-color="#2a3a4a"/><stop offset="1" stop-color="#14202b"/></radialGradient><radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#f2a33a"/><stop offset="1" stop-color="#a8641a"/>
    </radialGradient><radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1f4630"/><stop offset="1" stop-color="#0d1712"/>
    </radialGradient><clipPath id="c"><rect width="1024" height="1024" rx="200"/></clipPath></defs>
<rect width="1024" height="500" fill="url(#g)"/>
<g transform="translate(60 50) scale(0.39)" clip-path="url(#c)"><rect width="1024" height="1024" fill="url(#bg)"/><!-- desk -->
  <rect x="0" y="660" width="1024" height="364" fill="#7a4512" opacity=".45"/>
  <rect x="0" y="652" width="1024" height="16" fill="#5e360f" opacity=".6"/>
  <!-- cable from the computer to the bomb -->
  <path d="M555 470 C 610 480, 600 640, 650 645 C 650 650, 650 610, 667 585" fill="none" stroke="#14202b" stroke-width="16" stroke-linecap="round"/>
  <!-- bomb sitting on the desk -->
  <g id="bomb" transform="translate(-45 0)">
    <path d="M880 395 C 900 340, 940 345, 965 300" fill="none" stroke="#5a3d1c" stroke-width="18" stroke-linecap="round"/>
    <rect x="820" y="375" width="80" height="60" rx="12" transform="rotate(32 860 405)" fill="#23272e"/>
    <circle cx="835" cy="525" r="140" fill="#23272e"/>
    <ellipse cx="775" cy="455" rx="36" ry="20" transform="rotate(-35 775 455)" fill="#fff" opacity=".22"/>
    <path d="M970 250 L980 275 L1008 275 L986 291 L996 317 L970 301 L944 317 L954 291 L932 275 L960 275 Z" fill="#ffe27a" stroke="#fff6c8" stroke-width="5"/>
  </g>
  <!-- computer -->
  <g id="pc">
    <rect x="300" y="540" width="70" height="100" fill="#2a2f37"/>
    <rect x="225" y="628" width="220" height="30" rx="10" fill="#2a2f37"/>
    <rect x="110" y="140" width="450" height="410" rx="28" fill="#2a2f37"/>
    <rect x="140" y="170" width="390" height="350" rx="12" fill="url(#glow)"/>
    <circle cx="275" cy="285" r="54" fill="#22c55e"/><circle cx="395" cy="285" r="54" fill="#22c55e"/>
    <circle cx="275" cy="405" r="54" fill="#22c55e"/><circle cx="395" cy="405" r="54" fill="#22c55e"/>
  </g>
  <!-- the player, seen from behind -->
  <g id="person" fill="#14202b">
    <path d="M40 1024 C 40 920, 110 875, 230 862 C 270 858, 290 845, 300 820 L 380 820 C 390 845, 410 858, 450 862 C 570 875, 640 920, 640 1024 Z"/>
    <ellipse cx="340" cy="740" rx="98" ry="110"/>
  </g>
</g>
<text x="500" y="225" fill="#e3e8ed" font-family="Chakra Petch" font-weight="700" font-size="84">CRACK THE</text>
<text x="500" y="320" fill="#f2a33a" font-family="Chakra Petch" font-weight="700" font-size="104">CODE</text>
<text x="502" y="372" fill="#9aa7b4" font-family="IBM Plex Sans" font-size="30">Defuse the bomb before it goes off.</text>
</svg>
